name: Diem
description: Diem is a consumer social search engine, delivered as an iOS and Android app,
  that surfaces community-driven answers to questions people are often reluctant to ask
  elsewhere - positioning itself as "a search engine that feels like you're asking questions
  in a girl's bathroom at 1am." The Diem experience centers on a women-focused community,
  a Gems rewards program redeemable for products and features, a weekly newsletter, a merch
  shop, and companion products such as the Twin Flame astrology-compatibility app. Diem is
  backed by a16z, Ribbit Capital, and Techstars. It is a consumer application with no public
  API, developer portal, SDKs, or documentation surface at this time; this profile captures
  its public web identity and domain-security posture.
